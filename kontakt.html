<link rel="icon" type="image/png" href="img/loggalink.png">

<body>

<header class="site-header">

    <div class="logo-area">

    <nav class="main-nav">
      <a href="index.html" class="nav-box">Startsida</a>

      <a href="kontakt.html" class="nav-box" active >Kontakt</a>
    </nav>

  </div>
</header>

<main>

    <main class="contact-page">

        <h2>Kontakt</h2>
      
        <form id="kontaktForm">
      
          <label for="namn">Namn</label>
          <input type="text" id="namn" name="namn" required>
      
          <label for="email">E-post</label>
          <input type="email" id="email" name="email" required>
      
          <label for="meddelande">Meddelande</label>
          <textarea id="meddelande" name="meddelande" required></textarea>
      
          <button type="submit">Skicka</button>
          <div id="status"></div>
      
        </form>
      
      </main>
      
      <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
      
      <script>
        emailjs.init("6YEQrI7h44a9iHkGL");
      
        const form = document.getElementById("kontaktForm");
        const statusDiv = document.getElementById("status");
      
        form.addEventListener("submit", function (e) {
          e.preventDefault();
      
          emailjs.sendForm(
            "service_qssa7tm",
            "template_6v9c2cg",
            this
          ).then(() => {
            statusDiv.textContent = "Meddelandet skickades!";
            form.reset();
          }).catch(err => {
            statusDiv.textContent = "Något gick fel.";
            console.error(err);
          });
        });
      </script>
      
    
</main>
